services:
  - type: web
    name: fs-mini-app
    runtime: static
    buildCommand: cd fs-search-mini-app && npm ci && npm run build
    staticPublishPath: ./fs-search-mini-app/dist
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: VITE_BASE
        value: /

  - type: web
    name: fs-search-bot
    runtime: docker
    plan: free
    dockerfilePath: ./fs-search-bot/Dockerfile
    dockerContext: ./fs-search-bot
    healthCheckPath: /health
    envVars:
      - key: ASPNETCORE_ENVIRONMENT
        value: Production
      - key: TelegramBotToken
        sync: false
      - key: MINI_APP_URL
        sync: false
